[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "6"
colored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
genai = "0.5"
backon = "1.6"
git2 = "0.20"
tempfile = "3"
ignore = "0.4"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-indicatif = "0.3.14"

# Internal crates
ath-types = { path = "crates/ath-types" }
ath-config = { path = "crates/ath-config" }
ath-cli = { path = "crates/ath-cli" }
ath-agents = { path = "crates/ath-agents" }
ath-git = { path = "crates/ath-git" }
ath-memory = { path = "crates/ath-memory" }
ath-planner = { path = "crates/ath-planner" }
ath-orchestrator = { path = "crates/ath-orchestrator" }
