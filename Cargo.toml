[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "6"
colored = "3"

# Internal crates
ath-types = { path = "crates/ath-types" }
ath-config = { path = "crates/ath-config" }
ath-cli = { path = "crates/ath-cli" }
ath-agents = { path = "crates/ath-agents" }
ath-git = { path = "crates/ath-git" }
ath-planner = { path = "crates/ath-planner" }
ath-orchestrator = { path = "crates/ath-orchestrator" }
